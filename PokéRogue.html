<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
  
</head>
<body>

  <!-- Fullscreen Game Embed -->
  <iframe 
    src="https://pokerogue-omega-neon.vercel.app" 
    allow="autoplay; fullscreen; keyboard"
    allowfullscreen>
  </iframe>

</body>
</html>
